name: Cmd2SMS Build / Release

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  push:
    branches: [ "main" ]
    tags:
      - '*'
  create:

env:
  PROJECTNAME: ${{ format('{0}-{1}', vars.PROJECTNAME || github.event.repository.name || 'hello-world', github.event_name == 'create' && github.ref_name || 'DEV') }}
  PROJNAME: 'hello-world'
  GH_TOKEN: ${{ github.token }}

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Instalar SDCC
      run: |
          sudo apt-get update
          sudo apt-get install -y sdcc gputils
          sdcc --version
    #- name: SDCC-Install
    #  run: sudo apt update && sudo apt install sdcc gputils && sdcc --version
    - name: Exec
      #run: chmod +x c2sms.sh && ./c2sms.sh -e ${{ env.PROJNAME }}
      run: make p=${{ env.PROJNAME }} e=1 c=0
    - name: Guardar y subir cambios 1 (Commit & Push)
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Actualización automática 1 desde GitHub Actions"
        #branch: main
    - name: Preparar directorios y permisos
        #mkdir -p ./projects/${{ env.PROJNAME }}/bin
      run: |
        chmod -R 777 ./projects/${{ env.PROJNAME }}
    - name: Compile
      run: make -C ./projects/${{ env.PROJNAME }} valid
    - name: Guardar y subir cambios 2 (Commit & Push)
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Actualización automática 2 desde GitHub Actions"
        #branch: main
    - name: Change Dir
      run: cd ./projects/${{ env.PROJNAME }} 
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJNAME }}_art
        path: |
          ./projects/${{ env.PROJNAME }}/bin/*.sms
        if-no-files-found: warn #error

  release:
    if: ${{ github.event_name == 'create' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.PROJNAME }}_art
    - name: Change Dir
      run: cd ./projects/${{ env.PROJNAME }} 
    - name: Release
      if: ${{ github.event_name == 'create' }}
      # if release already exists, attach the output artifacts to it
      # else try to create a release with a discussion post (will fail if discussion not enabled)
      # else try to create a release without a discussion post
      run: |
        OUTPUTS=$({ ls /bin/*.sms; } 2>/dev/null | tr '\n' ' ') && \
        echo $OUTPUTS | xargs gh release upload ${{ github.ref_name }} --clobber || \
        echo $OUTPUTS | xargs gh release create ${{ github.ref_name }} --generate-notes --title '${{ github.repository }} ${{ github.ref_name }}' --discussion-category 'Announcements' || \
        echo $OUTPUTS | xargs gh release create ${{ github.ref_name }} --generate-notes --title '${{ github.repository }} ${{ github.ref_name }}'
      env:
        GH_TOKEN: ${{ github.token }}
